name: Runware LipSync Result Poller

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Poll accepted Runware task
        env:
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cat > poll-request.json <<'JSON'
          [
            {
              "taskType": "getResponse",
              "taskUUID": "f162ee36-94ef-4415-8962-8d239c87fc38"
            }
          ]
          JSON
          for attempt in $(seq 1 40); do
            curl --silent --show-error --fail -X POST 'https://api.runware.ai/v1' -H "Authorization: Bearer $RUNWARE_API_KEY" -H 'Content-Type: application/json' --data-binary @poll-request.json -o response.json
            cat response.json
            video_url="$(jq -r '[.data[]? | select(.status == "success" and .videoURL != null)][0].videoURL // empty' response.json)"
            if [ -n "$video_url" ]; then
              printf '%s\n' "$video_url" > video_url.txt
              curl --silent --show-error --fail --location "$video_url" -o Crib_Scout_Scene_1_LipSync.mp4
              break
            fi
            error_count="$(jq -r '.errors | length' response.json)"
            if [ "$error_count" != "0" ]; then
              exit 1
            fi
            sleep 10
          done
          test -s Crib_Scout_Scene_1_LipSync.mp4

      - name: Save completed output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runware-final-output
          path: |
            poll-request.json
            response.json
            video_url.txt
            Crib_Scout_Scene_1_LipSync.mp4
